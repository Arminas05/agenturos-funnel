# Šis vardas privalo SUTAPTI su Cloudflare Worker'io pavadinimu, kitaip
# `wrangler deploy` kurtų naują Worker'į vietoj to, kuris jau prijungtas
# prie Git. Čia jis paveldėtas iš repozitoriumo vardo, nes Cloudflare taip
# pavadino projektą kuriant.
#
# Antram klientui: kurdami Worker'į skydelyje duokite jam kliento vardą
# (pvz. `fotografas`) ir tą patį įrašykite čia — vienas repozitoriumas,
# keli Worker'iai, kiekvienas su savo katalogu ir savo D1 baze.
name = "agenturos-funnel"
main = "src/index.js"
compatibility_date = "2026-07-28"

# Statiniai failai. Workers Static Assets pakeitė Pages nustatymą
# `pages_build_output_dir`. `_headers` ir `_redirects` failai
# `public/` kataloge veikia lygiai taip pat kaip anksčiau.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 duomenų bazė kontaktams. Ši bazė jau sukurta ir lentelė paruošta.
# Naujam funnel'iui:  npx wrangler d1 create <vardas>
# ir grąžintą id įrašyti čia.
#
# Skirtingai nei Pages, Workers projektuose šio bindingo skydelyje
# atskirai kartoti NEREIKIA — jis pritaikomas iš šio failo diegimo metu.
[[d1_databases]]
binding = "DB"
database_name = "renginiai-leads"
database_id = "4008592d-ac1d-40f2-b8a4-45b01090c27e"

[observability]
enabled = true

# Slaptų kintamųjų (RESEND_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# TURNSTILE_SECRET, LEADS_TOKEN) į šį failą RAŠYTI NEGALIMA — jis yra git'e.
# Jie nustatomi skydelyje: Workers projektas → Settings →
# Variables and Secrets → Add → Secret
#
# El. pašto pranešimams reikia trijų reikšmių:
#   RESEND_API_KEY   (Secret) — raktas iš resend.com
#   LEAD_EMAIL_TO    (Text)   — kam siųsti, pvz. labas@vedejasandrius.lt
#   LEAD_EMAIL_FROM  (Text)   — nuo ko; domenas turi būti patvirtintas
#                               Resend'e, pvz. uzklausos@send.vedejasandrius.lt
#
# Nenustačius bent vieno, laiškai tiesiog nesiunčiami — forma ir toliau
# veikia ir rašo į D1. Taip sąmoningai: pranešimo gedimas neturi kainuoti
# kliento kontakto.
